<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mordparta</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div id="clock"></div>
  <div id="daybar"><div id="dayfill"></div><span id="daylabel"></span></div>
  <div id="ops"></div>
  <button id="continue">Continue ▶</button>
</header>
<main>
  <section id="board">
    <nav id="tabs"></nav>
    <div id="view"></div>
  </section>
</main>
<div id="modal" hidden><div id="modal-box"></div></div>
<script src="cases/taxi.js"></script>
<script src="cases/zmizela.js"></script>
<script>
  // Case picker: ?case=<id> plays that case, otherwise show the list (first = newest).
  (function () {
    const id = new URLSearchParams(location.search).get('case');
    window.CASE = window.CASES.find((c) => c.id === id);
    if (window.CASE) { const s = document.createElement('script'); s.src = 'src/engine.js'; document.body.appendChild(s); return; }
    document.getElementById('modal-box').innerHTML = '<h2>Mordparta – pick a case</h2>' + window.CASES.map((c) =>
      '<div class="card"><h3><a href="?case=' + c.id + '">' + c.title + '</a></h3><div class="dim">' + (c.teaser || '') + '</div></div>').join('');
    document.getElementById('modal').hidden = false;
  })();
</script>
</body>
</html>
